<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수령확인증</title>
<style>
  :root {
    --pri:#9FA0FF;      /* 포인트 */
    --mint:#D5E8E6;     /* 보조 */
    --cream:#FFF3E3;    /* 배경 */
    --coral:#FF7171;    /* 경고·삭제 */
    --ink:#23233f;
    --sub:#6b6b82;
    --line:rgba(35,35,63,.10);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--cream); }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; background:var(--cream); color:var(--ink); -webkit-font-smoothing:antialiased; }
  .wrap { max-width:640px; margin:0 auto; padding:12px 16px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size:34px; font-weight:700; letter-spacing:-.02em; margin:18px 4px 14px; }

  /* 카드 */
  .card { background:#fff; border-radius:20px; padding:18px 16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(35,35,63,.04), 0 8px 24px rgba(159,160,255,.10); }
  .card h2 { font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px; }
  label.f { display:block; font-size:13px; font-weight:500; color:var(--sub); margin:16px 2px 6px; }

  /* 입력 */
  input[type=text], input[type=tel], input[type=date] {
    width:100%; padding:13px 14px; font-size:17px; font-family:inherit; color:var(--ink);
    border:1.5px solid transparent; border-radius:12px; background:#f6f5f2; outline:none; appearance:none; -webkit-appearance:none; min-height:48px;
    transition:border-color .15s, background .15s;
  }
  input[type=date] { text-align:left; }
  input::placeholder { color:#a8a8b8; }
  input:focus { background:#fff; border-color:var(--pri); box-shadow:0 0 0 4px rgba(159,160,255,.22); }

  /* 세그먼트 컨트롤 (라디오) */
  .seg-group { display:flex; background:var(--mint); border-radius:12px; padding:3px; gap:2px; }
  .seg { flex:1; position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  .seg span { display:block; text-align:center; padding:10px 6px; font-size:15px; font-weight:500; border-radius:10px; color:#4b5f5c; transition:all .18s; }
  .seg input:checked + span { background:#fff; color:var(--ink); font-weight:600; box-shadow:0 2px 6px rgba(35,35,63,.14); }
  .seg input:focus-visible + span { outline:3px solid var(--pri); outline-offset:1px; }
  .seg-group.consent .seg input[value=Y]:checked + span { background:var(--pri); color:var(--ink); }
  .seg-group.consent .seg input[value=N]:checked + span { background:var(--coral); color:#fff; }

  /* 지급품 */
  .hdr, .item { display:grid; grid-template-columns:1fr 64px 1fr 40px; gap:6px; align-items:center; }
  .hdr { font-size:12px; color:var(--sub); margin:12px 2px 6px; }
  .item { margin-bottom:8px; }
  .item input { padding:11px 10px; font-size:16px; }
  .item button { width:36px; height:36px; border:0; border-radius:50%; background:rgba(255,113,113,.14); color:var(--coral); font-size:16px; font-weight:700; cursor:pointer; }

  /* 버튼 */
  button.btn { display:block; width:100%; padding:15px 16px; font-size:17px; font-weight:600; font-family:inherit; border:0; border-radius:14px; background:var(--pri); color:var(--ink); cursor:pointer; transition:transform .1s, opacity .15s; }
  button.btn:active { transform:scale(.98); opacity:.9; }
  button.btn:disabled { opacity:.6; }
  button.sub { background:var(--mint); color:var(--ink); font-size:15px; padding:12px 14px; }
  #addItem { margin-top:4px; }
  .top { display:flex; gap:8px; margin-bottom:10px; }
  .top button { flex:1; }

  /* 서명 */
  .sig { border:1.5px dashed rgba(35,35,63,.25); border-radius:14px; background:#fbfaf8; touch-action:none; width:100%; height:160px; display:block; }
  .sigbar { display:flex; justify-content:flex-end; margin-top:6px; font-size:14px; }
  .sigbar a { color:#6b6cf0; cursor:pointer; font-weight:500; padding:4px 2px; }
  .hint { color:var(--coral); font-size:12px; font-weight:400; }

  .box { background:var(--cream); font-size:13px; line-height:1.6; padding:12px 14px; border-radius:12px; margin:8px 0 12px; color:#4a4a63; }

  .msg { padding:13px 14px; border-radius:14px; margin:10px 0 14px; font-size:15px; display:none; line-height:1.5; }
  .msg a { color:inherit; font-weight:600; }
  .ok { background:var(--mint); color:#1f4a45; }
  .err { background:rgba(255,113,113,.16); color:#b53a3a; }

  dialog { border:0; border-radius:22px; padding:18px; width:min(92vw,520px); box-shadow:0 20px 60px rgba(35,35,63,.25); color:var(--ink); }
  dialog::backdrop { background:rgba(35,35,63,.35); backdrop-filter:blur(6px); }
  dialog ul { list-style:none; padding:0; margin:10px 0; max-height:50vh; overflow:auto; }
  dialog li { padding:14px 8px; border-bottom:1px solid var(--line); cursor:pointer; font-size:16px; }
  dialog li:active { background:var(--mint); }
  small.cur { color:#2f6f66; font-size:13px; }
  small.cur a { color:#6b6cf0; }
  dialog#cal { padding:14px; width:min(94vw,380px); }
  .cal-nav { display:grid; grid-template-columns:36px 36px 1fr 78px 36px 36px; gap:4px; align-items:center; margin-bottom:10px; }
  .cal-nav button { height:38px; border:0; border-radius:10px; background:var(--mint); font-size:18px; font-weight:600; color:var(--ink); cursor:pointer; }
  .cal-nav select { height:38px; border:0; border-radius:10px; background:#f6f5f2; font-size:16px; font-weight:600; font-family:inherit; color:var(--ink); padding:0 6px; width:100%; }
  .cal-week, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-week span { font-size:12px; color:var(--sub); padding:4px 0; }
  .cal-week span:first-child { color:var(--coral); }
  .cal-grid button { aspect-ratio:1; border:0; border-radius:50%; background:transparent; font-size:16px; font-family:inherit; color:var(--ink); cursor:pointer; }
  .cal-grid button:active { background:var(--mint); }
  .cal-grid button.sel { background:var(--pri); font-weight:700; }
  .cal-grid button.sun { color:var(--coral); }
  .cal-grid button:disabled { color:#c9c9d4; cursor:default; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>수령확인증</h1>

  <div class="top">
    <button class="btn sub" id="btnLoad" type="button">저장된 문서 불러오기</button>
    <button class="btn sub" id="btnNew" type="button">새로 작성</button>
  </div>
  <div id="cur" style="margin:0 4px 12px"></div>

  <div class="card">
    <h2>수령인</h2>
    <div class="seg-group" style="margin-top:10px">
      <label class="seg"><input type="radio" name="role" value="본인" checked><span>본인</span></label>
      <label class="seg"><input type="radio" name="role" value="대리인"><span>대리인</span></label>
    </div>
    <label class="f">본인과의 관계</label>
    <div class="seg-group">
      <label class="seg"><input type="radio" name="rel" value="본인" checked><span>본인</span></label>
      <label class="seg"><input type="radio" name="rel" value="동거인"><span>동거인</span></label>
      <label class="seg"><input type="radio" name="rel" value="기타"><span>기타</span></label>
    </div>
    <input type="text" id="relEtc" placeholder="기타 관계 직접 입력" style="display:none;margin-top:8px">
    <label class="f">성명</label><input type="text" id="name" autocomplete="name">
    <label class="f">연락처</label><input type="tel" id="phone" placeholder="숫자만 입력 (예: 01012341234)" inputmode="numeric" autocomplete="tel" maxlength="13">
    <label class="f">생년월일</label><input type="text" id="birth" readonly inputmode="none" placeholder="눌러서 달력에서 선택" style="cursor:pointer">
    <label class="f">주소</label><input type="text" id="addr" autocomplete="street-address">
  </div>

  <div class="card">
    <h2>수령내용</h2>
    <div class="hdr"><span>지급품</span><span>수량</span><span>비고</span><span></span></div>
    <div id="items"></div>
    <button class="btn sub" id="addItem" type="button">줄 추가</button>
    <label class="f">수령장소</label><input type="text" id="place">
    <label class="f">수령일</label><input type="date" id="date">
  </div>

  <div class="card">
    <h2>개인정보 수집·이용 동의 (필수)</h2>
    <div class="box">
      의정부시일시청소년쉼터(이동형)에서는 긴급지원을 위하여 수령인의 개인정보를 수집·이용하려고 합니다.<br>
      · 수집항목: 성명, 생년월일, 연락처, 주소<br>
      · 수집목적: 수령인(본인 또는 대리인) 확인<br>
      · 보유기간: 5년 (공공기관의 기록물관리에 관한 법률 시행령 제26조)<br>
      ※ 동의를 거부할 권리가 있으나, 거부 시 지급품 수령이 불가합니다.
    </div>
    <div class="seg-group consent">
      <label class="seg"><input type="radio" name="consent" value="Y"><span>동의</span></label>
      <label class="seg"><input type="radio" name="consent" value="N"><span>비동의</span></label>
    </div>
  </div>

  <div class="card">
    <h2>서명</h2>
    <label class="f">수령인 서명 <span class="hint">(이름을 정자로 입력해주세요. 또박또박)</span></label>
    <canvas class="sig" id="sigR"></canvas>
    <div class="sigbar"><a data-clear="sigR">지우기</a></div>
    <label class="f">확인자 서명 <span class="hint">(이름을 정자로 입력해주세요. 또박또박)</span></label>
    <canvas class="sig" id="sigC"></canvas>
    <div class="sigbar"><a data-clear="sigC">지우기</a></div>
  </div>

  <div class="card">
    <label class="f" style="margin-top:0">접근 코드</label>
    <input type="text" id="key" autocomplete="off" placeholder="관리자에게 받은 코드">
  </div>

  <div class="msg" id="msg"></div>
  <button class="btn" id="btnSave" type="button">저장 (구글 Docs에 반영)</button>
</div>

<dialog id="cal">
  <div class="cal-nav">
    <button type="button" id="yPrev" aria-label="이전 해">«</button>
    <button type="button" id="mPrev" aria-label="이전 달">‹</button>
    <select id="ySel" aria-label="연도"></select>
    <select id="mSel" aria-label="월"></select>
    <button type="button" id="mNext" aria-label="다음 달">›</button>
    <button type="button" id="yNext" aria-label="다음 해">»</button>
  </div>
  <div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="top" style="margin:12px 0 0">
    <button class="btn sub" type="button" id="calClear">지우기</button>
    <button class="btn sub" type="button" id="calClose">닫기</button>
  </div>
</dialog>

<dialog id="dlg">
  <b style="font-size:19px">저장된 수령확인증</b>
  <ul id="list"><li>불러오는 중…</li></ul>
  <button class="btn sub" type="button" onclick="dlg.close()">닫기</button>
</dialog>

<script>
/* Apps Script 웹앱 배포 URL (고정) */
const API = 'https://script.google.com/macros/s/AKfycbzf81jH4Ud8Wi_7ahYWkhxdgf90kekY4o0stjVMknmuvj8k6b4HyZUCts-PfZMzLwPM/exec';

const $ = id => document.getElementById(id);
let currentId = null;
const dlg = $('dlg');

/* ---------- 날짜 기본값(오늘, 한국시간) ---------- */
function today() {
  return new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
}
$('date').value = today();
$('key').value = sessionStorage.getItem('rc_key') || '';

/* ---------- 연락처 자동 하이픈 ---------- */
function fmtPhone(v) {
  const d = String(v).replace(/\D/g, '').slice(0, 11);
  if (d.startsWith('02')) {            // 서울 지역번호
    if (d.length <= 2) return d;
    if (d.length <= 5) return d.slice(0, 2) + '-' + d.slice(2);
    if (d.length <= 9) return d.slice(0, 2) + '-' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
    return d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6, 10);
  }
  if (d.length <= 3) return d;
  if (d.length <= 7) return d.slice(0, 3) + '-' + d.slice(3);
  if (d.length <= 10) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
  return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
}
$('phone').addEventListener('input', e => { e.target.value = fmtPhone(e.target.value); });

/* ---------- 생년월일: 달력 값 ↔ "0000년 0월 0일" ---------- */
function birthToText(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? m[1] + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일' : '';
}
function birthToIso(txt) {
  txt = String(txt || '');
  let m = /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(txt);   // 2008년 1월 31일 / 2008-01-31
  if (!m) return '';
  return m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
}

/* ---------- 생년월일 달력 (연·월 이동 가능) ---------- */
const cal = $('cal'), MIN_Y = 1930, MAX_Y = +today().slice(0, 4);
let cy = 2010, cm = 0;
for (let y = MAX_Y; y >= MIN_Y; y--) $('ySel').add(new Option(y + '년', y));
for (let m = 0; m < 12; m++) $('mSel').add(new Option((m + 1) + '월', m));
function setBirth(iso) { $('birth').dataset.iso = iso || ''; $('birth').value = birthToText(iso); }
function renderCal() {
  cy = Math.min(MAX_Y, Math.max(MIN_Y, cy));
  $('ySel').value = cy; $('mSel').value = cm;
  const g = $('calGrid'); g.innerHTML = '';
  const first = new Date(cy, cm, 1).getDay(), last = new Date(cy, cm + 1, 0).getDate();
  const sel = $('birth').dataset.iso || '', tdy = today();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('span'));
  for (let d = 1; d <= last; d++) {
    const iso = cy + '-' + ('0' + (cm + 1)).slice(-2) + '-' + ('0' + d).slice(-2);
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = d;
    if (iso === sel) b.className = 'sel';
    else if ((first + d - 1) % 7 === 0) b.className = 'sun';
    if (iso > tdy) b.disabled = true;
    b.onclick = () => { setBirth(iso); cal.close(); };
    g.appendChild(b);
  }
}
function moveMonth(n) { cm += n; while (cm < 0) { cm += 12; cy--; } while (cm > 11) { cm -= 12; cy++; } renderCal(); }
$('birth').onclick = () => {
  const iso = $('birth').dataset.iso;
  if (iso) { cy = +iso.slice(0, 4); cm = +iso.slice(5, 7) - 1; } else { cy = 2010; cm = 0; }
  renderCal(); cal.showModal();
};
$('yPrev').onclick = () => { cy--; renderCal(); };
$('yNext').onclick = () => { cy++; renderCal(); };
$('mPrev').onclick = () => moveMonth(-1);
$('mNext').onclick = () => moveMonth(1);
$('ySel').onchange = () => { cy = +$('ySel').value; renderCal(); };
$('mSel').onchange = () => { cm = +$('mSel').value; renderCal(); };
$('calClear').onclick = () => { setBirth(''); cal.close(); };
$('calClose').onclick = () => cal.close();

/* ---------- 관계 ---------- */
document.querySelectorAll('input[name=rel]').forEach(r => r.addEventListener('change', () => {
  $('relEtc').style.display = val('rel') === '기타' ? 'block' : 'none';
}));
document.querySelectorAll('input[name=role]').forEach(r => r.addEventListener('change', () => {
  if (val('role') === '본인') setRadio('rel', '본인');
  $('relEtc').style.display = val('rel') === '기타' ? 'block' : 'none';
}));
function val(n) { const e = document.querySelector('input[name=' + n + ']:checked'); return e ? e.value : ''; }
function setRadio(n, v) { document.querySelectorAll('input[name=' + n + ']').forEach(e => e.checked = (e.value === v)); }

/* ---------- 지급품 행 ---------- */
function addRow(v) {
  v = v || {};
  const d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<input type="text" class="i-item" placeholder="지급품"><input type="text" class="i-qty" placeholder="수량" inputmode="numeric"><input type="text" class="i-note" placeholder="비고"><button type="button" title="삭제">✕</button>';
  d.querySelector('.i-item').value = v.item || '';
  d.querySelector('.i-qty').value = v.qty || '';
  d.querySelector('.i-note').value = v.note || '';
  d.querySelector('button').onclick = () => { if ($('items').children.length > 1) d.remove(); else { d.querySelectorAll('input').forEach(i => i.value = ''); } };
  $('items').appendChild(d);
}
$('addItem').onclick = () => addRow();
addRow();

/* ---------- 서명 패드 ---------- */
function pad(id) {
  const c = $(id), ctx = c.getContext('2d');
  let drawing = false, dirty = false;
  function size() {
    const r = c.getBoundingClientRect(), s = window.devicePixelRatio || 1;
    const keep = dirty ? c.toDataURL() : null;
    c.width = r.width * s; c.height = r.height * s;
    ctx.scale(s, s); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
    if (keep) { const i = new Image(); i.onload = () => ctx.drawImage(i, 0, 0, r.width, r.height); i.src = keep; }
  }
  function pos(e) { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y + 0.1); ctx.stroke(); dirty = true; e.preventDefault(); });
  c.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); e.preventDefault(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => c.addEventListener(t, () => drawing = false));
  window.addEventListener('resize', size);
  size();
  return {
    clear() { ctx.clearRect(0, 0, c.width, c.height); dirty = false; },
    isEmpty() { return !dirty; },
    data() { return dirty ? c.toDataURL('image/png') : ''; },
    load(url) {
      this.clear();
      if (!url) return;
      const i = new Image(), r = c.getBoundingClientRect();
      i.onload = () => { ctx.drawImage(i, 0, 0, r.width, r.height); dirty = true; };
      i.src = url;
    }
  };
}
const sigR = pad('sigR'), sigC = pad('sigC');
document.querySelectorAll('[data-clear]').forEach(a => a.onclick = () => (a.dataset.clear === 'sigR' ? sigR : sigC).clear());

/* ---------- 입력값 수집 / 채우기 ---------- */
function collect() {
  const items = [...document.querySelectorAll('.item')].map(r => ({
    item: r.querySelector('.i-item').value.trim(),
    qty: r.querySelector('.i-qty').value.trim(),
    note: r.querySelector('.i-note').value.trim()
  })).filter(i => i.item || i.qty || i.note);
  return {
    role: val('role'), relType: val('rel'), relEtc: $('relEtc').value.trim(),
    name: $('name').value.trim(), phone: fmtPhone($('phone').value),
    birth: $('birth').value, addr: $('addr').value.trim(),
    items, place: $('place').value.trim(), date: $('date').value,
    consent: val('consent'),
    sigReceiver: sigR.data(), sigChecker: sigC.data()
  };
}
function fill(d) {
  setRadio('role', d.role || '본인'); setRadio('rel', d.relType || '본인');
  $('relEtc').value = d.relEtc || ''; $('relEtc').style.display = d.relType === '기타' ? 'block' : 'none';
  $('name').value = d.name || ''; $('phone').value = fmtPhone(d.phone || '');
  setBirth(birthToIso(d.birth)); $('addr').value = d.addr || '';
  $('items').innerHTML = '';
  (d.items && d.items.length ? d.items : [{}]).forEach(addRow);
  $('place').value = d.place || ''; $('date').value = d.date || today();
  setRadio('consent', d.consent || '');
  sigR.load(d.sigReceiver); sigC.load(d.sigChecker);
}
function reset() { currentId = null; $('cur').innerHTML = ''; fill({}); window.scrollTo(0, 0); }
$('btnNew').onclick = () => { if (confirm('입력 내용을 지우고 새로 작성할까요?')) reset(); };

/* ---------- 메시지 ---------- */
function show(t, ok, html) {
  const m = $('msg'); m.className = 'msg ' + (ok ? 'ok' : 'err'); m[html ? 'innerHTML' : 'textContent'] = t; m.style.display = 'block';
  m.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- 저장 ---------- */
$('btnSave').onclick = async () => {
  const d = collect();
  if (!d.role) return show('수령인(본인/대리인)을 선택하세요.');
  if (!d.name) return show('성명을 입력하세요.');
  if (!d.phone) return show('연락처를 입력하세요.');
  if (d.role === '대리인' && d.relType === '본인') return show('대리인인 경우 "본인과의 관계"를 동거인 또는 기타로 선택하세요.');
  if (d.relType === '기타' && !d.relEtc) return show('기타 관계를 입력하세요.');
  if (!d.consent) return show('개인정보 동의 여부를 선택하세요.');
  if (d.consent === 'N' && !confirm('비동의 시 지급품 수령이 불가합니다. 그래도 저장할까요?')) return;
  if (sigR.isEmpty()) return show('수령인 서명을 해주세요.');
  const key = $('key').value.trim(); sessionStorage.setItem('rc_key', key);
  if (API.includes('여기에_배포_ID')) return show('Receipt.html 안의 API 주소를 Apps Script 웹앱(/exec) URL로 바꿔주세요.');
  const b = $('btnSave'); b.disabled = true; b.textContent = '저장 중… (10~20초 걸릴 수 있어요)';
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'save', key, id: currentId, data: d }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    currentId = j.id;
    $('cur').innerHTML = '<small class="cur">편집 중인 문서: ' + esc(d.name) + ' · <a href="' + j.url + '" target="_blank">Docs 열기</a></small>';
    let t = '저장되었습니다. <a href="' + j.url + '" target="_blank">구글 Docs 열기</a>';
    if (j.warnings && j.warnings.length) t += '<br><small>※ 양식에서 찾지 못한 항목: ' + j.warnings.map(esc).join(', ') + '</small>';
    if (j.tables && j.tables.length) t += '<details><summary><small>양식 구조 보기 (문제 있을 때 관리자에게 전달)</small></summary><small>' + j.tables.map(esc).join('<br>') + '</small></details>';
    show(t, true, true);
  } catch (e) {
    let m = e.message;
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m += ' → 웹앱 URL(API)이 올바른지, 배포 액세스가 "모든 사용자"인지, 권한 승인을 했는지 확인하세요.';
    show('저장 실패: ' + m);
  }
  b.disabled = false; b.textContent = '저장 (구글 Docs에 반영)';
};
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- 불러오기 ---------- */
$('btnLoad').onclick = async () => {
  const key = $('key').value.trim();
  if (!key) { show('아래 접근 코드를 먼저 입력하세요.'); return; }
  sessionStorage.setItem('rc_key', key);
  $('list').innerHTML = '<li>불러오는 중…</li>'; dlg.showModal();
  try {
    const j = await (await fetch(API + '?action=list&key=' + encodeURIComponent(key))).json();
    if (!j.ok) throw new Error(j.error);
    $('list').innerHTML = j.items.length ? '' : '<li>저장된 문서가 없습니다.</li>';
    j.items.forEach(it => {
      const li = document.createElement('li');
      li.textContent = it.name + '  (' + new Date(it.updated).toLocaleString('ko-KR') + ')';
      li.onclick = () => loadOne(it.id, it.name);
      $('list').appendChild(li);
    });
  } catch (e) { $('list').innerHTML = '<li>' + esc(e.message) + (/접근 코드/.test(e.message) ? '<br><small>※ 아래 접근 코드 칸 값과 Code.gs의 PASSCODE가 같은지, 새 버전으로 재배포했는지 확인하세요.</small>' : '') + '</li>'; }
};
async function loadOne(id, name) {
  $('list').innerHTML = '<li>불러오는 중…</li>';
  try {
    const key = $('key').value.trim();
    const j = await (await fetch(API + '?action=get&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(key))).json();
    if (!j.ok) throw new Error(j.error);
    fill(j.data); currentId = id; dlg.close();
    $('cur').innerHTML = '<small class="cur">편집 중인 문서: ' + esc(name) + ' · <a href="https://docs.google.com/document/d/' + id + '/edit" target="_blank">Docs 열기</a></small>';
    window.scrollTo(0, 0);
  } catch (e) { $('list').innerHTML = '<li>' + esc(e.message) + (/접근 코드/.test(e.message) ? '<br><small>※ 아래 접근 코드 칸 값과 Code.gs의 PASSCODE가 같은지, 새 버전으로 재배포했는지 확인하세요.</small>' : '') + '</li>'; }
}
</script>
</body>
</html>
