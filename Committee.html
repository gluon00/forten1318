<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>위임장 제출</title>
<style>
  :root{--navy:#1f3a5f;--ink:#1f2a37;--muted:#6b7783;--line:#d5dbe1;--shade:#eef2f6;--bg:#f3f5f8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,sans-serif;font-size:16px;line-height:1.6;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  header{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 54px}
  header small{opacity:.75;font-size:13px;letter-spacing:.05em}
  header h2{margin:2px 0 0;font-size:19px;font-weight:700}
  .wrap{max-width:560px;margin:-36px auto 0;padding:0 12px}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(20,40,70,.08);padding:22px 18px;margin-bottom:14px}
  .paper h1{margin:0;text-align:center;font-size:26px;letter-spacing:.55em;padding-left:.55em;color:var(--ink)}
  .rule{height:1px;background:var(--line);margin:16px 0}
  .tbl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tr{display:flex;border-top:1px solid var(--line)}
  .tr:first-child{border-top:0}
  .th{flex:none;width:68px;background:var(--shade);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;padding:12px 4px;letter-spacing:.2em}
  .td{padding:12px 14px;font-size:15px;word-break:keep-all;flex:1}
  .text{margin-top:18px;line-height:2;word-break:keep-all;text-align:justify;font-size:16px}
  .sec{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:17px;font-weight:700}
  .sec i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
  label,.lbl{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
  .lbl small{font-weight:400;color:#c0392b;margin-left:4px}
  input{width:100%;min-height:54px;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
  input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(31,58,95,.15)}
  .field+.field{margin-top:20px}
  .pad{position:relative;border:2px dashed #9aa6b2;border-radius:14px;background:#fff;overflow:hidden}
  canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;touch-action:none;user-select:none;-webkit-user-select:none}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b5bec7;font-size:18px;pointer-events:none}
  .padbar{display:flex;justify-content:flex-end;margin-top:6px}
  .link{background:none;border:0;color:var(--navy);font:inherit;font-weight:700;padding:10px 6px;min-height:44px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto}
  #send{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:inherit;font-size:18px;font-weight:700}
  #send:disabled{opacity:.45}
  #msg{color:#c0392b;font-size:14px;text-align:center;margin:0 0 8px}
  #msg:empty{display:none}
  .state{text-align:center;padding:36px 8px;color:var(--muted)}
  .done{text-align:center;padding:64px 12px;font-size:19px;line-height:1.9}
  .done b{display:block;font-size:46px;margin-bottom:6px}
</style>
</head>
<body>
<header><small id="org">&nbsp;</small><h2 id="session">위임장</h2></header>

<div class="wrap" id="app">
  <div class="card paper" id="paper">
    <div class="state">불러오는 중...</div>
  </div>

  <div class="card" id="form" hidden>
    <p class="sec"><i>1</i>작성 정보</p>
    <div class="field"><label for="date">작성일</label><input id="date" type="date"></div>
    <div class="field"><label for="name">위원명</label><input id="name" type="text" maxlength="30" autocomplete="name" enterkeyhint="done" placeholder="이름을 입력하세요"></div>

    <p class="sec" style="margin-top:26px"><i>2</i>자필 서명</p>
    <div class="lbl" style="margin-top:-6px">아래 칸에 손가락으로 서명해주세요</div>
    <div class="pad">
      <canvas id="cv" width="800" height="400"></canvas>
      <div class="hint" id="hint">여기에 서명하세요</div>
    </div>
    <div class="padbar"><button class="link" id="clear" type="button">서명 지우기</button></div>
  </div>
</div>

<div class="bar" id="bar" hidden><div class="in">
  <p id="msg" role="alert"></p>
  <button id="send" type="button">제출하기</button>
</div></div>

<script>
(function(){
  // ▼ 앱스 스크립트 웹 앱 URL(/exec)만 넣으면 됩니다. 회차·날짜 문구는 Code.gs에서 자동으로 가져옵니다.
  var API_URL='https://script.google.com/macros/s/AKfycbz9N4eRpLhQ42w8j3C-r8_22f1k9PuWKdRhmJ04sOrx8catBdU_h4eav8_a4ltFA9UHbA/exec';

  var $=function(id){return document.getElementById(id);};
  var paper=$('paper'), msg=$('msg'), btn=$('send');

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function showLoadError(why){
    paper.innerHTML='<div class="state">내용을 불러오지 못했습니다.<br><small style="display:block;margin:8px 0;word-break:keep-all">'+esc(why)+'</small><button class="link" id="retry" type="button">다시 시도</button></div>';
    $('retry').onclick=loadConfig;
  }

  function loadConfig(){
    paper.innerHTML='<div class="state">불러오는 중...</div>';
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL)){
      showLoadError('API_URL이 올바르게 설정되지 않았습니다. index.html의 API_URL에 웹 앱 URL(…/exec)을 넣어주세요.');
      return;
    }
    fetch(API_URL).then(function(r){return r.text();}).then(function(txt){
      var c;
      try{c=JSON.parse(txt);}catch(e){
        throw new Error('응답이 올바르지 않습니다. 배포의 액세스 권한이 "모든 사용자"인지, 코드 수정 후 새 버전으로 배포했는지 확인해주세요.');
      }
      if(!c.ok||!c.subject) throw new Error('서버 응답에 문구가 없습니다. Code.gs를 최신 내용으로 바꾸고 새 버전으로 다시 배포해주세요.');
      $('org').textContent=c.org;
      $('session').textContent=c.session+' 위임장';
      paper.innerHTML=
        '<h1>위임장</h1><div class="rule"></div>'+
        '<div class="tbl">'+
          '<div class="tr"><div class="th">수신</div><div class="td">'+esc(c.recipient)+'</div></div>'+
          '<div class="tr"><div class="th">제목</div><div class="td">'+esc(c.subject)+'</div></div>'+
        '</div>'+
        '<p class="text">'+esc(c.body)+'</p>';
      $('form').hidden=false; $('bar').hidden=false;
    }).catch(function(err){
      console.error(err);
      var m=(err&&err.message)||'';
      showLoadError(/Failed to fetch|NetworkError|Load failed/i.test(m)
        ? '서버에 연결하지 못했습니다. 웹 앱 URL과 액세스 권한("모든 사용자")을 확인해주세요.' : m);
    });
  }
  loadConfig();

  // 오늘 날짜 기본값
  var t=new Date();
  $('date').value=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);

  // 서명 캔버스
  var cv=$('cv'), ctx=cv.getContext('2d'), drawing=false, dirty=false, hint=$('hint');
  function reset(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';}
  reset();
  function pos(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};}
  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();drawing=true;cv.setPointerCapture(e.pointerId);
    var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();
    dirty=true;hint.style.display='none';
  });
  cv.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){cv.addEventListener(n,function(){drawing=false;});});
  $('clear').onclick=function(){reset();dirty=false;hint.style.display='flex';};

  // 제출
  btn.onclick=function(){
    msg.textContent='';
    var name=$('name').value.trim(), date=$('date').value;
    if(!date){msg.textContent='작성일을 선택해주세요.';return;}
    if(!name){msg.textContent='위원명을 입력해주세요.';$('name').focus();return;}
    if(!dirty){msg.textContent='서명을 해주세요.';return;}
    btn.disabled=true;btn.textContent='제출 중...';
    fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({name:name,date:date,signature:cv.toDataURL('image/png')})
    })
    .then(function(r){return r.json();})
    .then(function(res){
      if(!res.ok) throw new Error(res.error||'제출에 실패했습니다.');
      $('bar').remove();$('form').remove();
      paper.innerHTML='<div class="done"><b>✅</b>제출이 완료되었습니다.<br>감사합니다.</div>';
      window.scrollTo(0,0);
    })
    .catch(function(err){
      btn.disabled=false;btn.textContent='제출하기';
      msg.textContent=(err&&err.message)||'제출에 실패했습니다. 다시 시도해주세요.';
    });
  };
})();
</script>
</body>
</html>
