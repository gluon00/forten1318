<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9FA0FF">
<title>강사비 지급내역서</title>
<style>
  :root{
    --pri:#9FA0FF;          /* 메인 */
    --pri-dk:#7f80ee;
    --mint:#D5E8E6;         /* 보조 */
    --cream:#FFF3E3;        /* 배경 */
    --coral:#FF7171;        /* 포인트/오류 */
    --ink:#2b2a4c;
    --sub:#7c7b9a;
    --line:#e6dccb;
    --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:17px}
  body{margin:0;background:var(--cream);color:var(--ink);line-height:1.5;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}

  /* 상단 */
  .appbar{background:var(--pri);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;text-align:center}
  h1{margin:0;font-size:1.15rem;font-weight:700}

  .wrap{max-width:480px;margin:0 auto;padding:12px 16px 150px}

  /* 카드 */
  .sec{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 16px;margin-top:12px}
  .sec.done{border-color:var(--pri)}
  .sec.bad{border-color:var(--coral)}
  .sec h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.95rem;font-weight:700}
  .num{color:var(--pri-dk);font-weight:700}
  .sec.done .num{color:var(--pri-dk)}

  /* 입력칸 */
  input[type=date],input[type=text]{
    display:block;width:100%;max-width:100%;min-width:0;min-height:50px;
    padding:10px 12px;font-size:1rem;font-family:inherit;color:var(--ink);text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    -webkit-appearance:none;appearance:none}
  input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
  input[type=date]::-webkit-calendar-picker-indicator{margin:0}
  input:focus{outline:none;border-color:var(--pri)}

  /* 강사명 */
  .who{font-size:1.15rem;font-weight:700}
  .who.empty{font-size:.92rem;font-weight:500;color:var(--coral)}

  /* 활동일 */
  .daytext{margin-top:8px;min-height:1.5em;font-size:.95rem;font-weight:600;color:var(--pri-dk)}

  /* 장소 선택 */
  .opt{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;margin-top:8px;
       background:#fff;border:1px solid var(--line);border-radius:6px;font-size:1rem;cursor:pointer}
  .opt:first-child{margin-top:0}
  .opt input{position:absolute;opacity:0;width:0;height:0}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid #cfc4b0;background:#fff;flex:none}
  .opt input:checked + .dot{border-color:var(--pri);background:var(--pri);box-shadow:inset 0 0 0 4px #fff}
  .opt input:focus-visible + .dot{outline:2px solid var(--pri);outline-offset:2px}
  .opt.on{border-color:var(--pri);background:#f6f6ff}
  #etc{margin-top:8px}
  .note{margin:10px 0 0;font-size:.85rem;color:var(--sub);min-height:1.2em}

  /* 서명 */
  .sigbox{position:relative}
  canvas{display:block;width:100%;aspect-ratio:600/240;background:#fff;border:1px dashed var(--pri);
         border-radius:6px;touch-action:none}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      color:#b3b2cf;font-size:.95rem;pointer-events:none;z-index:1}
  .ghost{margin-left:auto;min-height:32px;padding:0 12px;font-size:.85rem;font-weight:600;color:var(--ink);
         background:var(--mint);border:0;border-radius:6px}

  /* 메시지 */
  #msg{display:none;margin-top:12px;padding:12px 14px;border-radius:6px;font-size:.92rem;line-height:1.55}
  #msg.err{display:block;background:#ffe9e9;color:#d64545}
  #msg.ok{display:block;background:var(--mint);color:#2f6b62}
  #msg a{color:inherit;font-weight:700}

  /* 하단 고정 바 */
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--cream);border-top:1px solid var(--line);
       padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar > div{max-width:480px;margin:0 auto}
  .prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.82rem;color:var(--sub)}
  .track{flex:1;height:4px;background:var(--mint);border-radius:2px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--coral);transition:width .25s}
  #submit{width:100%;min-height:52px;font-size:1.05rem;font-weight:700;color:#fff;
          background:var(--pri);border:0;border-radius:6px}
  #submit:active{background:var(--pri-dk)}
  #submit:disabled{background:#cfd0ff}
</style>
</head>
<body>
<div class="appbar">
  <h1>강사비 지급내역서</h1>
</div>

<div class="wrap">
  <section class="sec" id="s0">
    <h2><span class="num">1</span>강사명 확인</h2>
    <div class="who" id="who">불러오는 중...</div>
  </section>

  <section class="sec" id="s1">
    <h2><span class="num">2</span>활동일</h2>
    <input type="date" id="date">
    <div class="daytext" id="dayText"></div>
  </section>

  <section class="sec" id="s2">
    <h2><span class="num">3</span>활동장소</h2>
    <div id="places"></div>
    <input type="text" id="etc" placeholder="활동장소를 직접 입력" hidden>
    <p class="note" id="note"></p>
  </section>

  <section class="sec" id="s3">
    <h2><span class="num">4</span>서명<button type="button" class="ghost" id="clear">지우기</button></h2>
    <div class="sigbox">
      <canvas id="sig" width="600" height="240"></canvas>
      <div class="ph" id="ph">여기에 손가락으로 서명하세요</div>
    </div>
  </section>

  <div id="msg"></div>
</div>

<div class="bar">
  <div>
    <div class="prog"><span id="progTxt">0/3 입력 완료</span><div class="track"><i id="fill"></i></div></div>
    <button id="submit" type="button">제출하기</button>
  </div>
</div>

<script>
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxJeamFlR7Uj9BMVvXthfOQzPJHN57taLcztPYeJuasySJHE0GWqi2Xi_MZMvcAbHeS/exec',
  PLACES: ['홈플러스 상담버스', '민락2지구 상담버스', '의정부역 상담버스'],
  DAY_PLACE: { 3: 0, 4: 1, 5: 2 }   // 수→홈플러스, 목→민락2지구, 금→의정부역
};
const DAYS = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);

/* 오늘 날짜 (기기 현지 시간 기준, yyyy-mm-dd) */
function todayStr() {
  const t = new Date();
  const p = n => String(n).padStart(2, '0');
  return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate());
}

/* 진행 상태 표시 */
function mark(id, on) { $(id).classList.toggle('done', !!on); }
function update() {
  const d = !!$('date').value;
  const pl = getPlace();
  const p = !!pl && (pl !== '기타' || $('etc').value.trim() !== '');
  mark('s1', d); mark('s2', p); mark('s3', hasSig);
  const n = [d, p, hasSig].filter(Boolean).length;
  $('progTxt').textContent = n === 3 ? '입력 완료! 제출할 수 있어요' : `${n}/3 입력 완료`;
  $('fill').style.width = (n / 3 * 100) + '%';
}

/* 강사명 확인 (기본 양식의 성명을 불러옴) */
let instructorName = '';
(async () => {
  const w = $('who');
  try {
    const res = await fetch(CONFIG.GAS_URL + '?action=info');
    const data = await res.json();
    if (data.ok && data.name) {
      instructorName = data.name;
      w.textContent = data.name;
      mark('s0', true);
    } else {
      w.textContent = '양식에서 성명을 찾지 못했어요';
      w.classList.add('empty');
    }
  } catch (e) {
    w.textContent = '이름을 불러오지 못했어요 (제출은 가능해요)';
    w.classList.add('empty');
  }
})();

/* 안내/오류 표시 */
function clearBad() { document.querySelectorAll('.sec.bad').forEach(s => s.classList.remove('bad')); }
function fail(text, secId) {
  clearBad();
  const sec = $(secId);
  sec.classList.add('bad');
  const m = $('msg'); m.className = 'err'; m.textContent = text;
  sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function hideMsg() { $('msg').className = ''; $('msg').textContent = ''; clearBad(); }

/* 장소 선택 */
const box = $('places');
[...CONFIG.PLACES, '기타'].forEach(p => {
  const l = document.createElement('label');
  l.className = 'opt';
  l.innerHTML = `<input type="radio" name="place" value="${p}"><span class="dot"></span><span>${p}</span>`;
  box.appendChild(l);
});
function getPlace() {
  const r = document.querySelector('input[name=place]:checked');
  return r ? r.value : '';
}
function refreshPlace() {
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
  $('etc').hidden = getPlace() !== '기타';
}
box.addEventListener('change', () => {
  refreshPlace(); $('note').textContent = ''; hideMsg(); update();
  if (getPlace() === '기타') $('etc').focus();
});

/* 활동일 → 요일 → 장소 자동 선택 */
function onDateChange() {
  hideMsg();
  const v = $('date').value;
  if (!v) { $('dayText').textContent = ''; update(); return; }
  const [y, m, d] = v.split('-').map(Number);
  const w = new Date(y, m - 1, d).getDay();
  $('dayText').textContent = `${y}년 ${m}월 ${d}일 ${DAYS[w]}요일`;
  const idx = CONFIG.DAY_PLACE[w];
  const radios = document.querySelectorAll('input[name=place]');
  if (idx !== undefined) {
    radios[idx].checked = true;
    $('note').textContent = `${DAYS[w]}요일이라 "${CONFIG.PLACES[idx]}"이 선택됐어요. 다르면 바꿔주세요.`;
  } else {
    radios.forEach(r => r.checked = false);
    $('note').textContent = '수·목·금이 아니에요. 장소를 직접 선택해 주세요.';
  }
  refreshPlace(); update();
}
$('date').addEventListener('change', onDateChange);
$('etc').addEventListener('input', () => { hideMsg(); update(); });

/* 서명 */
const cv = $('sig'), ctx = cv.getContext('2d');
let drawing = false, hasSig = false, last = null;
ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  drawing = true; hasSig = true; $('ph').style.display = 'none'; hideMsg();
  last = pos(e);
  ctx.beginPath(); ctx.arc(last.x, last.y, 2, 0, Math.PI * 2); ctx.fill();
  update();
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  last = p;
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
function clearSig() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  hasSig = false; $('ph').style.display = 'flex'; update();
}
$('clear').addEventListener('click', clearSig);

/* 제출 */
$('submit').addEventListener('click', async () => {
  const date = $('date').value;
  const place = getPlace();
  const etc = $('etc').value.trim();

  if (!date) return fail('활동일을 선택해 주세요.', 's1');
  if (!place) return fail('활동장소를 선택해 주세요.', 's2');
  if (place === '기타' && !etc) return fail('기타 활동장소를 입력해 주세요.', 's2');
  if (!hasSig) return fail('서명해 주세요.', 's3');
  hideMsg();

  const placeText = place === '기타' ? `기타(${etc})` : place;
  const ok = confirm(`이 내용으로 제출할까요?\n\n강사명: ${instructorName || '(확인 안 됨)'}\n활동일: ${$('dayText').textContent}\n활동장소: ${placeText}`);
  if (!ok) return;

  const btn = $('submit');
  btn.disabled = true; btn.textContent = '제출 중...';
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        date, place, placeEtc: etc,
        signature: cv.toDataURL('image/png')
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '문서 생성 실패');

    const m = $('msg'); m.className = 'ok';
    m.innerHTML = `제출이 완료됐어요.<br><a href="${data.url}" target="_blank" rel="noopener">완성된 문서 열기</a>`;
    clearSig();
    $('etc').value = '';
    $('date').value = todayStr(); onDateChange();   // 활동일은 다시 오늘로
    m.className = 'ok';
    m.innerHTML = `제출이 완료됐어요.<br><a href="${data.url}" target="_blank" rel="noopener">완성된 문서 열기</a>`;
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) {
    const m = $('msg'); m.className = 'err';
    m.innerHTML = '문서를 만들지 못했어요. 드라이브에 이미 만들어졌는지 확인하고, 없을 때만 다시 제출해 주세요.<br><small>' + err.message + '</small>';
  } finally {
    btn.disabled = false; btn.textContent = '제출하기';
  }
});

/* 시작 시 활동일 기본값 = 작성일(오늘) */
$('date').value = todayStr();
onDateChange();
</script>
</body>
</html>
