<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>강사비 지급내역서</title>
<style>
  :root{
    --ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--bg:#f4f6fb;
    --pri:#2563eb;--pri-dk:#1d4ed8;--pri-bg:#eff6ff;
    --ok:#059669;--ok-bg:#ecfdf5;--err:#dc2626;--err-bg:#fef2f2;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 18px rgba(15,23,42,.05)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:17px}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:26px 16px 170px}

  /* 헤더 (가운데 정렬) */
  header{text-align:center;padding:6px 0 4px}
  .logo{width:58px;height:58px;margin:0 auto 14px;border-radius:19px;background:var(--pri);
        display:flex;align-items:center;justify-content:center;font-size:29px;
        box-shadow:0 8px 20px rgba(37,99,235,.28)}
  h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;text-align:center}
  .lead{margin:6px 0 0;color:var(--sub);font-size:.93rem;text-align:center}

  /* 카드 */
  .sec{background:#fff;border:1.5px solid transparent;border-radius:20px;padding:18px 16px 20px;
       margin-top:14px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
  .sec.done{border-color:#bbf7d0}
  .sec.bad{border-color:var(--err)}
  .sec h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:1.05rem;font-weight:700}
  .num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-size:.85rem;font-weight:700;
       display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .2s}
  .sec.done .num{background:var(--ok);font-size:0}
  .sec.done .num::after{content:"✓";font-size:.95rem}

  /* 입력칸 */
  input[type=date],input[type=text]{
    display:block;width:100%;max-width:100%;min-width:0;min-height:56px;
    padding:12px 16px;font-size:1.02rem;font-family:inherit;color:var(--ink);text-align:left;
    background:#f8fafc;border:1.5px solid var(--line);border-radius:14px;
    -webkit-appearance:none;appearance:none}
  input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.4em}
  input[type=date]::-webkit-calendar-picker-indicator{margin:0}
  input[type=date],input[type=text]{transition:border-color .15s,box-shadow .15s,background .15s}
  input:focus{outline:none;background:#fff;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-bg)}

  /* 강사명 */
  .profile{display:flex;align-items:center;gap:14px}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--pri-bg);color:var(--pri);
          font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .who{font-size:1.4rem;font-weight:800;letter-spacing:-.01em;line-height:1.3}
  .role{font-size:.85rem;color:var(--sub)}
  .who.empty{font-size:.95rem;font-weight:500;color:var(--err)}

  /* 활동일 */
  .daytext{margin-top:12px;min-height:1.7em;font-size:1.05rem;font-weight:700;color:var(--pri)}

  /* 장소 선택 */
  .opt{position:relative;display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px;margin-top:10px;
       background:#f8fafc;border:1.5px solid var(--line);border-radius:14px;font-size:1.03rem;cursor:pointer;
       transition:border-color .15s,background .15s}
  .opt:first-child{margin-top:0}
  .opt input{position:absolute;opacity:0;width:0;height:0}
  .dot{width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;flex:none;
       transition:border-color .15s,background .15s,box-shadow .15s}
  .opt input:checked + .dot{border-color:var(--pri);background:var(--pri);box-shadow:inset 0 0 0 5px #fff}
  .opt input:focus-visible + .dot{box-shadow:0 0 0 4px var(--pri-bg)}
  .opt.on{border-color:var(--pri);background:var(--pri-bg);font-weight:700}
  #etc{margin-top:10px}
  .note{margin:12px 0 0;font-size:.88rem;color:var(--pri);min-height:1.3em}

  /* 서명 */
  .sigbox{position:relative}
  canvas{display:block;width:100%;aspect-ratio:600/240;background:#fff;border:1.5px dashed #94a3b8;
         border-radius:14px;touch-action:none}
  .sigbox::after{content:"";position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1px solid #e2e8f0;pointer-events:none}
  .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      color:#94a3b8;font-size:1rem;pointer-events:none;z-index:1}
  .ghost{margin-left:auto;min-height:38px;padding:0 16px;font-size:.88rem;font-weight:600;color:var(--sub);
         background:#fff;border:1.5px solid var(--line);border-radius:999px}
  .ghost:active{background:#f1f5f9}

  /* 메시지 */
  #msg{display:none;margin-top:16px;padding:15px 16px;border-radius:14px;font-size:.95rem;line-height:1.55}
  #msg.err{display:block;background:var(--err-bg);color:var(--err)}
  #msg.ok{display:block;background:var(--ok-bg);color:var(--ok)}
  #msg a{color:inherit;font-weight:800}

  /* 하단 고정 바 */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
       -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
       border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar > div{max-width:480px;margin:0 auto}
  .prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.85rem;color:var(--sub)}
  .track{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .25s}
  #submit{width:100%;min-height:58px;font-size:1.1rem;font-weight:800;letter-spacing:-.01em;color:#fff;
          background:var(--pri);border:0;border-radius:16px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
  #submit:active{background:var(--pri-dk)}
  #submit:disabled{background:#93c5fd;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">🚌</div>
    <h1>강사비 지급내역서</h1>
    <p class="lead">강사명을 확인하고 아래 3가지를 입력해 주세요</p>
  </header>

  <section class="sec" id="s0">
    <h2><span class="num">1</span>강사명 확인</h2>
    <div class="profile">
      <div class="avatar" id="avatar">·</div>
      <div>
        <div class="who" id="who">불러오는 중...</div>
        <div class="role">강사</div>
      </div>
    </div>
  </section>

  <section class="sec" id="s1">
    <h2><span class="num">2</span>활동일</h2>
    <input type="date" id="date">
    <div class="daytext" id="dayText"></div>
  </section>

  <section class="sec" id="s2">
    <h2><span class="num">3</span>활동장소</h2>
    <div id="places"></div>
    <input type="text" id="etc" placeholder="활동장소를 직접 입력" hidden>
    <p class="note" id="note"></p>
  </section>

  <section class="sec" id="s3">
    <h2><span class="num">4</span>서명<button type="button" class="ghost" id="clear">지우기</button></h2>
    <div class="sigbox">
      <canvas id="sig" width="600" height="240"></canvas>
      <div class="ph" id="ph">여기에 손가락으로 서명하세요</div>
    </div>
  </section>

  <div id="msg"></div>
</div>

<div class="bar">
  <div>
    <div class="prog"><span id="progTxt">0/3 입력 완료</span><div class="track"><i id="fill"></i></div></div>
    <button id="submit" type="button">제출하기</button>
  </div>
</div>

<script>
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbxJeamFlR7Uj9BMVvXthfOQzPJHN57taLcztPYeJuasySJHE0GWqi2Xi_MZMvcAbHeS/exec',
  PLACES: ['홈플러스 상담버스', '민락2지구 상담버스', '의정부역 상담버스'],
  DAY_PLACE: { 3: 0, 4: 1, 5: 2 }   // 수→홈플러스, 목→민락2지구, 금→의정부역
};
const DAYS = ['일','월','화','수','목','금','토'];
const $ = id => document.getElementById(id);

/* 진행 상태 표시 */
function mark(id, on) { $(id).classList.toggle('done', !!on); }
function update() {
  const d = !!$('date').value;
  const pl = getPlace();
  const p = !!pl && (pl !== '기타' || $('etc').value.trim() !== '');
  mark('s1', d); mark('s2', p); mark('s3', hasSig);
  const n = [d, p, hasSig].filter(Boolean).length;
  $('progTxt').textContent = n === 3 ? '입력 완료! 제출할 수 있어요' : `${n}/3 입력 완료`;
  $('fill').style.width = (n / 3 * 100) + '%';
}

/* 강사명 확인 (기본 양식의 성명을 불러옴) */
let instructorName = '';
(async () => {
  const w = $('who');
  try {
    const res = await fetch(CONFIG.GAS_URL + '?action=info');
    const data = await res.json();
    if (data.ok && data.name) {
      instructorName = data.name;
      w.textContent = data.name;
      $('avatar').textContent = data.name.charAt(0);
      mark('s0', true);
    } else {
      w.textContent = '양식에서 성명을 찾지 못했어요';
      w.classList.add('empty');
    }
  } catch (e) {
    w.textContent = '이름을 불러오지 못했어요 (제출은 가능해요)';
    w.classList.add('empty');
  }
})();

/* 안내/오류 표시 */
function clearBad() { document.querySelectorAll('.sec.bad').forEach(s => s.classList.remove('bad')); }
function fail(text, secId) {
  clearBad();
  const sec = $(secId);
  sec.classList.add('bad');
  const m = $('msg'); m.className = 'err'; m.textContent = text;
  sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function hideMsg() { $('msg').className = ''; $('msg').textContent = ''; clearBad(); }

/* 장소 선택 */
const box = $('places');
[...CONFIG.PLACES, '기타'].forEach(p => {
  const l = document.createElement('label');
  l.className = 'opt';
  l.innerHTML = `<input type="radio" name="place" value="${p}"><span class="dot"></span><span>${p}</span>`;
  box.appendChild(l);
});
function getPlace() {
  const r = document.querySelector('input[name=place]:checked');
  return r ? r.value : '';
}
function refreshPlace() {
  document.querySelectorAll('.opt').forEach(o => o.classList.toggle('on', o.querySelector('input').checked));
  $('etc').hidden = getPlace() !== '기타';
}
box.addEventListener('change', () => {
  refreshPlace(); $('note').textContent = ''; hideMsg(); update();
  if (getPlace() === '기타') $('etc').focus();
});

/* 활동일 → 요일 → 장소 자동 선택 */
$('date').addEventListener('change', () => {
  hideMsg();
  const v = $('date').value;
  if (!v) { $('dayText').textContent = ''; update(); return; }
  const [y, m, d] = v.split('-').map(Number);
  const w = new Date(y, m - 1, d).getDay();
  $('dayText').textContent = `${y}년 ${m}월 ${d}일 ${DAYS[w]}요일`;
  const idx = CONFIG.DAY_PLACE[w];
  const radios = document.querySelectorAll('input[name=place]');
  if (idx !== undefined) {
    radios[idx].checked = true;
    $('note').textContent = `${DAYS[w]}요일이라 "${CONFIG.PLACES[idx]}"이 선택됐어요. 다르면 바꿔주세요.`;
  } else {
    radios.forEach(r => r.checked = false);
    $('note').textContent = '수·목·금이 아니에요. 장소를 직접 선택해 주세요.';
  }
  refreshPlace(); update();
});
$('etc').addEventListener('input', () => { hideMsg(); update(); });

/* 서명 */
const cv = $('sig'), ctx = cv.getContext('2d');
let drawing = false, hasSig = false, last = null;
ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
ctx.strokeStyle = '#000'; ctx.fillStyle = '#000';
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  drawing = true; hasSig = true; $('ph').style.display = 'none'; hideMsg();
  last = pos(e);
  ctx.beginPath(); ctx.arc(last.x, last.y, 2, 0, Math.PI * 2); ctx.fill();
  update();
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  e.preventDefault();
  const p = pos(e);
  ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  last = p;
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => drawing = false));
function clearSig() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  hasSig = false; $('ph').style.display = 'flex'; update();
}
$('clear').addEventListener('click', clearSig);

/* 제출 */
$('submit').addEventListener('click', async () => {
  const date = $('date').value;
  const place = getPlace();
  const etc = $('etc').value.trim();

  if (!date) return fail('활동일을 선택해 주세요.', 's1');
  if (!place) return fail('활동장소를 선택해 주세요.', 's2');
  if (place === '기타' && !etc) return fail('기타 활동장소를 입력해 주세요.', 's2');
  if (!hasSig) return fail('서명해 주세요.', 's3');
  hideMsg();

  const placeText = place === '기타' ? `기타(${etc})` : place;
  const ok = confirm(`이 내용으로 제출할까요?\n\n강사명: ${instructorName || '(확인 안 됨)'}\n활동일: ${$('dayText').textContent}\n활동장소: ${placeText}`);
  if (!ok) return;

  const btn = $('submit');
  btn.disabled = true; btn.textContent = '제출 중...';
  try {
    const res = await fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        date, place, placeEtc: etc,
        signature: cv.toDataURL('image/png')
      })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '문서 생성 실패');

    const m = $('msg'); m.className = 'ok';
    m.innerHTML = `제출이 완료됐어요.<br><a href="${data.url}" target="_blank" rel="noopener">완성된 문서 열기</a>`;
    clearSig();
    $('date').value = ''; $('dayText').textContent = ''; $('note').textContent = '';
    document.querySelectorAll('input[name=place]').forEach(r => r.checked = false);
    $('etc').value = ''; refreshPlace(); update();
    m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) {
    const m = $('msg'); m.className = 'err';
    m.innerHTML = '문서를 만들지 못했어요. 드라이브에 이미 만들어졌는지 확인하고, 없을 때만 다시 제출해 주세요.<br><small>' + err.message + '</small>';
  } finally {
    btn.disabled = false; btn.textContent = '제출하기';
  }
});

update();
</script>
</body>
</html>
