<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전문자원활동가 활동일지</title>
<style>
  :root{
    --bg:#FFF3E3;--card:rgba(255,255,255,.82);--ink:#1d1d1f;--sub:#86868b;--line:rgba(60,60,67,.14);
    --field:#FFFBF5;--accent:#9FA0FF;--accent-ink:#2a2a5c;--mint:#D5E8E6;--mint-ink:#1f5a55;--err:#FF7171;--err-bg:rgba(255,113,113,.14);
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(159,160,255,.12)
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#17161c;--card:rgba(40,39,48,.85);--ink:#f5f5f7;--sub:#9a9aa2;--line:rgba(255,255,255,.12);--field:#1f1e26;--accent:#9FA0FF;--accent-ink:#17163a;--mint:#2a3e3c;--mint-ink:#D5E8E6;--err-bg:rgba(255,113,113,.18);--shadow:0 8px 24px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:radial-gradient(1200px 500px at 50% -10%,var(--mint),transparent 70%),var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:28px 16px 64px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;text-align:center;margin:20px 0 26px}
  .card{background:var(--card);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
    border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  label.t{display:block;font-weight:700;font-size:15px;margin-bottom:10px}
  label.t small{font-weight:400;color:var(--sub);margin-left:4px;font-size:13px}
  .req{color:var(--err)}
  input[type=text],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--field);color:var(--ink);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
    background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px}
  textarea{resize:vertical;min-height:110px}
  textarea.big{min-height:220px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(159,160,255,.3)}
  .row{display:flex;gap:8px;align-items:center}
  .row>select{flex:1;min-width:0}
  .row .sep{flex:0 0 auto;color:var(--sub)}
  .seg{display:flex;gap:4px;padding:3px;margin-bottom:10px;background:var(--mint);border-radius:12px}
  .seg label{flex:1;text-align:center;padding:8px;border-radius:10px;cursor:pointer;color:var(--mint-ink);font-size:15px;transition:background .2s,box-shadow .2s}
  .seg input{display:none}
  .seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 2px 8px rgba(159,160,255,.5)}
  .hint{font-size:13px;color:var(--sub);margin-top:8px}
  .timeblock{margin-bottom:14px}
  .timeblock b{display:block;font-size:13px;margin-bottom:8px;color:var(--sub);font-weight:600}
  button{width:100%;padding:16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:17px;font-weight:700;
    cursor:pointer;box-shadow:0 6px 18px rgba(159,160,255,.45);transition:transform .15s,opacity .2s}
  button:active{transform:scale(.98)}
  button:disabled{opacity:.55;cursor:wait}
  .msg{display:none;margin-top:14px;padding:14px;border-radius:14px;text-align:center;font-weight:600}
  .msg.ok{display:block;background:var(--mint);color:var(--mint-ink)}
  .msg.err{display:block;background:var(--err-bg);color:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <h1>전문자원활동가 활동일지</h1>

  <form id="f" novalidate>
    <div class="card">
      <label class="t" for="name">성명 <span class="req">*</span></label>
      <input type="text" id="name" autocomplete="name" placeholder="이름을 입력하세요">
    </div>

    <div class="card">
      <label class="t" for="placeSel">장소 <span class="req">*</span></label>
      <select id="placeSel">
        <option value="">선택하세요</option>
        <option>홈플러스</option>
        <option>민락2지구</option>
        <option>의정부역</option>
        <option value="__etc">직접 작성</option>
      </select>
      <input type="text" id="placeEtc" placeholder="장소를 직접 입력하세요" style="display:none;margin-top:8px">
    </div>

    <div class="card">
      <label class="t" for="actDate">활동일(작성일) <span class="req">*</span></label>
      <input type="date" id="actDate">
      <div class="hint" id="actDateText">기본값은 오늘이며 다른 날짜로 변경할 수 있어요.</div>
    </div>

    <div class="card">
      <label class="t">활동시간 <span class="req">*</span></label>
      <div class="timeblock">
        <b>시작</b>
        <div class="seg">
          <label><input type="radio" name="sAP" value="오전"><span>오전</span></label>
          <label><input type="radio" name="sAP" value="오후" checked><span>오후</span></label>
        </div>
        <div class="row"><select id="sH"></select><span class="sep">시</span><select id="sM"></select><span class="sep">분</span></div>
      </div>
      <div class="timeblock" style="margin-bottom:0">
        <b>종료</b>
        <div class="seg">
          <label><input type="radio" name="eAP" value="오전"><span>오전</span></label>
          <label><input type="radio" name="eAP" value="오후" checked><span>오후</span></label>
        </div>
        <div class="row"><select id="eH"></select><span class="sep">시</span><select id="eM"></select><span class="sep">분</span></div>
      </div>
    </div>

    <div class="card">
      <label class="t" for="content">1. 활동내용 및 소감 <small>(예. 만난 청소년, 상담 시 주요 내용 및 활동 등)</small> <span class="req">*</span></label>
      <textarea id="content" class="big"></textarea>
    </div>

    <div class="card">
      <label class="t" for="opinion">2. 기타의견 및 평가 <small>(예. 활동 관련 피드백, 질문 등)</small></label>
      <textarea id="opinion"></textarea>
    </div>

    <div class="card">
      <label class="t" for="suggestion">3. 건의사항 <small>(예. 개인적으로 봉사활동을 통해 얻고 싶은 점, 요청사항 등)</small></label>
      <textarea id="suggestion"></textarea>
    </div>

    <button type="submit" id="btn">제출하기</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
// ▼ 앱스 스크립트 웹 앱 URL(…/exec)을 붙여넣으세요
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWq9tsfXEiSB3YC7bV-ZjfWaZNA_oI3SHkFeZAAlVU0ao4mMCKHrfA7Bb5cAlf5fs-VA/exec';

const $ = id => document.getElementById(id);
const DAYS = ['일','월','화','수','목','금','토'];

function pad(n){return String(n).padStart(2,'0');}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function kdate(v){ // 'YYYY-MM-DD' -> '2026년 11월 9일(월)'
  if(!v) return '';
  const [y,m,d]=v.split('-').map(Number);
  const w=DAYS[new Date(y,m-1,d).getDay()];
  return y+'년 '+m+'월 '+d+'일('+w+')';
}
function fill(sel,from,to,step,labelFn){
  sel.innerHTML='<option value="">선택</option>';
  for(let i=from;i<=to;i+=step){const o=document.createElement('option');o.value=pad(i);o.textContent=labelFn?labelFn(i):pad(i);sel.appendChild(o);}
}
fill($('sH'),1,12,1); fill($('eH'),1,12,1);
fill($('sM'),0,55,5); fill($('eM'),0,55,5);

// 기본 활동시간: 오후 7시 30분 ~ 오후 10시 30분
function setDefaultTimes(){
  document.querySelector('input[name="sAP"][value="오후"]').checked=true;
  document.querySelector('input[name="eAP"][value="오후"]').checked=true;
  $('sH').value='07'; $('sM').value='30';
  $('eH').value='10'; $('eM').value='30';
}
setDefaultTimes();

$('actDate').value=today();
const refresh=()=>{ $('actDateText').textContent=kdate($('actDate').value); };
$('actDate').addEventListener('input',refresh);
refresh();

$('placeSel').addEventListener('change',()=>{
  const etc=$('placeSel').value==='__etc';
  $('placeEtc').style.display=etc?'block':'none';
  if(etc) $('placeEtc').focus();
});

const radio = n => document.querySelector('input[name="'+n+'"]:checked').value;

function show(type,text){const m=$('msg');m.className='msg '+type;m.innerHTML=text;m.scrollIntoView({behavior:'smooth',block:'center'});}

$('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const place = $('placeSel').value==='__etc' ? $('placeEtc').value.trim() : $('placeSel').value;
  const name=$('name').value.trim();
  const content=$('content').value.trim();
  if(!name) return show('err','성명을 입력해 주세요.');
  if(!place) return show('err','장소를 선택하거나 입력해 주세요.');
  if(!$('actDate').value) return show('err','날짜를 선택해 주세요.');
  if(!$('sH').value||!$('sM').value||!$('eH').value||!$('eM').value) return show('err','활동 시작/종료 시간을 모두 선택해 주세요.');
  if(!content) return show('err','활동내용 및 소감을 입력해 주세요.');
  if(SCRIPT_URL.includes('여기에_배포_ID')) return show('err','SCRIPT_URL이 설정되지 않았습니다. 관리자에게 문의하세요.');

  const timeText = radio('sAP')+' '+$('sH').value+'시 '+$('sM').value+'분 ~ '+radio('eAP')+' '+$('eH').value+'시 '+$('eM').value+'분';
  const payload = {
    name, place,
    writeDate: $('actDate').value,
    writeDateText: kdate($('actDate').value),
    activityDateText: kdate($('actDate').value),
    timeText,
    content,
    opinion: $('opinion').value.trim(),
    suggestion: $('suggestion').value.trim()
  };

  const btn=$('btn'); btn.disabled=true; btn.textContent='제출 중…'; $('msg').className='msg';
  try{
    // 앱스 스크립트는 CORS 응답 헤더가 없어 no-cors + text/plain 으로 전송합니다.
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    show('ok','✅ 제출되었습니다. 수고하셨습니다!');
    $('f').reset(); $('placeEtc').style.display='none';
    setDefaultTimes();
    $('actDate').value=today(); refresh();
  }catch(err){
    show('err','제출에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요.');
  }finally{
    btn.disabled=false; btn.textContent='제출하기';
  }
});
</script>
</body>
</html>
