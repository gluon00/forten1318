<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 수집 폼</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        #map { height: 300px; width: 100%; background-color: #eee; margin-top: 10px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h2>개인정보 및 위치 제출</h2>
    
    <!-- 폼 시작 -->
    <form id="submitForm">
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="age">나이</label>
            <input type="number" id="age" name="age" required>
        </div>

        <div class="form-group">
            <label for="gender">성별</label>
            <select id="gender" name="gender" required>
                <option value="">선택하세요</option>
                <option value="남성">남성</option>
                <option value="여성">여성</option>
                <option value="기타">기타</option>
            </select>
        </div>

        <div class="form-group">
            <label>현재 위치 (자동 수집)</label>
            <div id="map">지도를 불러오는 중...</div>
            <!-- 위도/경도를 숨겨서 폼 데이터로 함께 전송 -->
            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lng" name="lng">
        </div>

        <button type="submit">구글 드라이브에 제출하기</button>
    </form>

    <script>
        // 1. 구글 지도 및 위치 정보 가져오기
        function initMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const pos = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    // 숨겨진 input에 위도, 경도 값 넣기
                    document.getElementById('lat').value = pos.lat;
                    document.getElementById('lng').value = pos.lng;

                    // 구글 지도 띄우기
                    const map = new google.maps.Map(document.getElementById("map"), {
                        center: pos,
                        zoom: 15,
                    });

                    // 현재 위치에 마커 표시
                    new google.maps.Marker({
                        position: pos,
                        map: map,
                    });
                }, function() {
                    document.getElementById('map').innerHTML = "위치 정보 권한을 허용해주세요.";
                });
            } else {
                document.getElementById('map').innerHTML = "이 브라우저에서는 위치 정보가 지원되지 않습니다.";
            }
        }

        // 2. 폼 제출 시 구글 스크립트로 데이터 전송하기
        document.getElementById('submitForm').addEventListener('submit', function(e) {
            e.preventDefault(); // 기본 제출 동작 막기

            const formData = new FormData(this);
            // ★ 아래 URL을 1단계에서 복사한 '웹 앱 URL'로 변경하세요 ★
            const scriptURL = 'https://script.google.com/macros/s/AKfycbwO3xnZCaajACIM5F3932q8-9A0F0HkWhIOqFrxd-k1kMPUM0-NMKpHVE-MB6ExtR_F/exec';

            // 데이터 전송 중 버튼 상태 변경
            const btn = document.querySelector('button');
            btn.innerText = "제출 중...";
            btn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert('성공적으로 구글 드라이브(스프레드시트)에 저장되었습니다!');
                    document.getElementById('submitForm').reset();
                    btn.innerText = "구글 드라이브에 제출하기";
                    btn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('제출에 실패했습니다.');
                    btn.innerText = "구글 드라이브에 제출하기";
                    btn.disabled = false;
                });
        });
    </script>

    <!-- ★ 아래 YOUR_GOOGLE_MAPS_API_KEY를 발급받은 실제 API 키로 변경하세요 ★ -->
    <script async defer src="AIzaSyAskRBiEXFHNo37srPh109IVPlZQcsN8uw"></script>
</body>
</html>
